{% extends 'base.html' %}
{% load static %}

{% block styles %}
<link href="{% static 'css/join.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Youth Connect Registration</h1>
    
    <form method="POST" class="registration-form" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Personal Information -->
        <div class="form-section">
            <h2>Personal Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="nin_number">NIN Number</label>
                    <input type="text" id="nin_number" name="nin_number" 
                           pattern="\d{14}" 
                           placeholder="14-digit National ID Number"
                           required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="marital_status">Marital Status</label>
                    <select id="marital_status" name="marital_status" required>
                        <option value="">Select Status</option>
                        <option value="single">Single</option>
                        <option value="married">Married</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
            </div>
        </div>

        <!-- Account Security -->
        <div class="form-section">
            <h2>Account Security</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" 
                           placeholder="example@domain.com" 
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" 
                               minlength="8" 
                               required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirm_password" 
                               name="confirm_password" 
                               minlength="8" 
                               required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Professional Information -->
        <div class="form-section">
            <h2>Professional Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="profession">Profession</label>
                    <input type="text" id="profession" name="profession" required>
                </div>

                <div class="form-group">
                    <label for="place_of_work">Place of Work</label>
                    <input type="text" id="place_of_work" name="place_of_work" required>
                </div>
            </div>
        </div>

        <!-- Next of Kin -->
        <div class="form-section">
            <h2>Next of Kin</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="kin_name">Full Name</label>
                    <input type="text" id="kin_name" name="kin_name" required>
                </div>

                <div class="form-group">
                    <label for="kin_email">Email</label>
                    <input type="email" id="kin_email" name="kin_email" required>
                </div>

                <div class="form-group">
                    <label for="kin_phone">Phone Number</label>
                    <input type="tel" id="kin_phone" name="kin_phone" 
                           pattern="[0-9]{10,15}" 
                           required>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn">Register Now</button>
    </form>
</div>

{% block scripts %}
<script>
// Password visibility toggle
document.querySelectorAll('.toggle-password').forEach(button => {
    button.addEventListener('click', function() {
        const input = this.previousElementSibling;
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        this.querySelector('i').classList.toggle('fa-eye-slash');
    });
});
</script>
{% endblock %}
{% endblock %}
